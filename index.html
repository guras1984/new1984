<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Airplane Fighters: Deluxe Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- 시작 화면 -->
        <div id="start-screen" class="screen">
            <div class="title-glow">✈️ 3D AIRPLANE FIGHTERS 🚀</div>
            <p>최고급 전투기를 선택하고 100스테이지의 찬란한 하늘을 정복하세요!</p>
            <div class="selection-container">
                <div class="plane-card selected" data-plane="standard">
                    <div class="plane-icon">✈️</div>
                    <h3>스탠더드 공군기</h3>
                    <p>균형 잡힌 표준형</p>
                </div>
                <div class="plane-card" data-plane="jet">
                    <div class="plane-icon">🚀</div>
                    <h3>레드 제트</h3>
                    <p>고속형 / 강력한 화력</p>
                </div>
                <div class="plane-card" data-plane="propeller">
                    <div class="plane-icon">🛩️</div>
                    <h3>블루 프로펠러</h3>
                    <p>안정적인 연사형</p>
                </div>
                <div class="plane-card" data-plane="cruiser">
                    <div class="plane-icon">🛸</div>
                    <h3>스타 크루저</h3>
                    <p>광역 확산 공격형</p>
                </div>
                <div class="plane-card" data-plane="copter">
                    <div class="plane-icon">🚁</div>
                    <h3>그린 헬기</h3>
                    <p>특수 방어형</p>
                </div>
            </div>
            <button id="start-btn" class="glow-btn">게임 시작하기</button>
        </div>

        <!-- 게임 플레이 화면 -->
        <div id="game-screen" class="screen hidden">
            <div id="hud">
                <div class="hud-item">STAGE <span id="stage">1</span>/100</div>
                <div class="hud-item">점수: <span id="score">0</span></div>
                <div class="hud-item">목숨: <span id="lives">3</span> ❤️</div>
                <div class="hud-item">폭탄: <span id="bombs">2</span> 💣</div>
                <div class="hud-item">총알수: <span id="spread">1</span>줄 🪙</div>
            </div>
            <div id="canvas-container">
                <canvas id="gameCanvas" width="480" height="580"></canvas>
                <!-- 스테이지 전환 안내 팝업 -->
                <div id="stage-banner" class="hidden">
                    <h2 id="banner-title">STAGE 1 CLEAR</h2>
                    <p id="banner-desc">다음 스테이지로 진입합니다...</p>
                </div>
            </div>
            <div id="controls-panel">
                <button id="bomb-btn" class="glow-btn">💥 필살기 폭탄 발사!</button>
            </div>
        </div>

        <!-- 게임 클리어 / 오버 화면 -->
        <div id="gameover-screen" class="screen hidden">
            <h2 id="gameover-title">GAME OVER</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button id="restart-btn" class="glow-btn">다시 도전하기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
