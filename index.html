<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Star Fighters: 1984 Nightmare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- 시작 화면 -->
        <div id="start-screen" class="screen">
            <h1>🐰 CUTE FIGHTERS vs 1984 👁️</h1>
            <p>빅 브라더의 감시망을 뚫고 나아가는 100스테이지 디스토피아 대모험!</p>
            <div class="selection-container">
                <div class="plane-card selected" data-plane="bunny">
                    <div class="plane-icon">🐰</div>
                    <h3>핑크 버니</h3>
                    <p>고속형 / 표준 연사</p>
                </div>
                <div class="plane-card" data-plane="duck">
                    <div class="plane-icon">🐥</div>
                    <h3>옐로우 덕</h3>
                    <p>밸런스형 / 2WAY탄</p>
                </div>
                <div class="plane-card" data-plane="cat">
                    <div class="plane-icon">🐱</div>
                    <h3>퍼플 캣</h3>
                    <p>확산형 / 3WAY탄</p>
                </div>
                <div class="plane-card" data-plane="bear">
                    <div class="plane-icon">🐻</div>
                    <h3>브라운 베어</h3>
                    <p>파워형 / 강력한 단발</p>
                </div>
                <div class="plane-card" data-plane="frog">
                    <div class="plane-icon">🐸</div>
                    <h3>그린 프로그</h3>
                    <p>특수형 / 넓은 범위</p>
                </div>
            </div>
            <button id="start-btn">사상항전 시작하기</button>
        </div>

        <!-- 게임 플레이 화면 -->
        <div id="game-screen" class="screen hidden">
            <div id="hud">
                <div>STAGE <span id="stage">1</span>/100</div>
                <div>점수: <span id="score">0</span></div>
                <div>목숨: <span id="lives">3</span> ❤️</div>
                <div>폭탄: <span id="bombs">2</span> 💣</div>
                <div>파워: Lv.<span id="power">1</span> 🎁</div>
            </div>
            <div id="canvas-container">
                <canvas id="gameCanvas" width="480" height="580"></canvas>
                <!-- 스테이지 전환 안내 팝업 -->
                <div id="stage-banner" class="hidden">
                    <h2 id="banner-title">STAGE 1 CLEAR</h2>
                    <p id="banner-desc">사상 검열을 통과했습니다...</p>
                </div>
            </div>
            <div id="controls-panel">
                <button id="bomb-btn">⚠️ 사상정화 폭탄 (빅 브라더 파괴)</button>
            </div>
        </div>

        <!-- 게임 클리어 / 오버 화면 -->
        <div id="gameover-screen" class="screen hidden">
            <h2 id="gameover-title">GAME OVER</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button id="restart-btn">다시 도전하기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
